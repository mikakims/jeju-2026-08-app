<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" width="320" height="430" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a5c"/><stop offset="50%" stop-color="#0a2340"/><stop offset="100%" stop-color="#03101f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8ef0c0" stop-opacity=".55"/><stop offset="100%" stop-color="#8ef0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="66" fill="#081c33"/>
  <rect y="66" width="320" height="364" fill="url(#night)"/>
  <circle cx="268" cy="26" r="11" fill="#f6f1c7" opacity=".85"/>
  <circle cx="263" cy="23" r="10" fill="#081c33"/>
  <path d="M0,66 q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" stroke="#7fa8c9" stroke-opacity=".55" stroke-width="2" fill="none"/>

  <path d="M6,12 L74,40" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <text x="12" y="30" font-size="10.5" fill="#9fc3dd">원투대 + 4000릴</text>
  <path d="M74,40 L112,92" stroke="#dfe8ef" stroke-width="1.6" fill="none"/>
  <path d="M112,92 L112,236" stroke="#dfe8ef" stroke-width="1.6"/>

  <!-- 전지찌 -->
  <circle cx="196" cy="104" r="30" fill="url(#glow)"/>
  <rect x="106" y="86" width="12" height="34" rx="6" fill="#e63946" stroke="#fff" stroke-width="1.6"/>
  <rect x="108" y="72" width="8" height="18" rx="4" fill="#8ef0c0"/>
  <circle cx="112" cy="70" r="4" fill="#c6ffe6"/>
  <text x="132" y="80" font-size="11" fill="#8ef0c0" font-weight="bold">전지찌 (LED)</text>
  <text x="132" y="93" font-size="9.5" fill="#cfe0ee">고부력 3~5호</text>
  <text x="132" y="106" font-size="9.5" fill="#ffb703">여부력은 봉돌로 최대한 깎기</text>

  <!-- 찌매듭 -->
  <path d="M106,140 L118,140" stroke="#ffb703" stroke-width="3" stroke-linecap="round"/>
  <text x="132" y="144" font-size="9.5" fill="#cfe0ee">찌매듭 = 수심 조절 (2~3m → 4~8m)</text>

  <!-- 봉돌 -->
  <ellipse cx="112" cy="180" rx="7" ry="9" fill="#6b7a88" stroke="#cfd8e0"/>
  <text x="132" y="184" font-size="9.5" fill="#cfe0ee">봉돌</text>

  <!-- 삼각도래 -->
  <path d="M112,236 L98,258 L126,258 Z" fill="#dbe4ee" stroke="#5b6b7a" stroke-width="1.2"/>
  <text x="140" y="252" font-size="10.5" fill="#fff" font-weight="bold">삼각도래</text>
  <text x="140" y="264" font-size="9" fill="#9fc3dd">추와 목줄을 분리</text>

  <!-- branch: 집어등 -->
  <path d="M98,258 L64,296" stroke="#dfe8ef" stroke-width="1.3"/>
  <circle cx="60" cy="302" r="16" fill="url(#glow)"/>
  <rect x="54" y="296" width="12" height="14" rx="3" fill="#2a9d8f" stroke="#8ef0c0"/>
  <text x="8" y="330" font-size="9.5" fill="#8ef0c0">집어등(녹색)</text>

  <!-- branch: 와이어 목줄 -->
  <path d="M126,258 L142,300" stroke="#c0c8d0" stroke-width="2.6" stroke-dasharray="3 2"/>
  <text x="156" y="292" font-size="10.5" fill="#e63946" font-weight="bold">와이어 목줄 (필수)</text>
  <text x="156" y="304" font-size="9" fill="#cfe0ee">갈치 이빨에 카본은 끊긴다</text>

  <!-- 바늘 + 미끼 -->
  <path d="M142,300 L146,352" stroke="#dfe8ef" stroke-width="1.6"/>
  <path d="M146,352 q0,18 -12,18 q-12,0 -12,-12" stroke="#f4f7fa" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M122,358 l0,-9" stroke="#f4f7fa" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M133,344 l22,10 l-4,9 l-22,-10 z" fill="#dfe3e8" stroke="#a8b4bf" stroke-width=".8"/>
  <text x="164" y="352" font-size="10.5" fill="#fff" font-weight="bold">갈치바늘 (큰 것)</text>
  <text x="164" y="364" font-size="9.5" fill="#cfe0ee">꽁치·전갱이살 슬라이스</text>
  <text x="164" y="376" font-size="9" fill="#9fc3dd">검지 두 마디 길이</text>

  <!-- 갈치 실루엣 -->
  <g opacity=".8">
    <path d="M40,392 q60,-14 130,-4 q40,6 78,-2 l4,7 q-40,10 -82,4 q-70,-10 -130,3 z" fill="#c9d6e2"/>
    <circle cx="243" cy="390" r="2" fill="#0a2340"/>
  </g>
  <text x="40" y="416" font-size="9.5" fill="#9fc3dd">밤에는 표층 가까이 부상 — 초저녁 2~3m부터 탐색</text>
</svg>
