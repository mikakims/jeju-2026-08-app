<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" width="320" height="430" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="night2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10395c"/><stop offset="55%" stop-color="#0a2340"/><stop offset="100%" stop-color="#03101f"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="0%">
      <stop offset="0%" stop-color="#fff6c9" stop-opacity=".55"/><stop offset="100%" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="58" fill="#071829"/>
  <rect y="58" width="320" height="372" fill="url(#night2)"/>
  <ellipse cx="86" cy="58" rx="86" ry="150" fill="url(#lamp)"/>
  <path d="M0,58 q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" stroke="#7fa8c9" stroke-opacity=".5" stroke-width="2" fill="none"/>

  <!-- 집어등 / 가로등 -->
  <rect x="80" y="8" width="12" height="26" rx="3" fill="#2a9d8f"/>
  <circle cx="86" cy="36" r="7" fill="#fff6c9"/>
  <text x="102" y="24" font-size="10" fill="#fff6c9" font-weight="bold">집어등 / 가로등</text>
  <text x="102" y="37" font-size="9" fill="#cfe0ee">한치는 추광성 — 빛에 모인다</text>

  <!-- 경계선 -->
  <path d="M172,58 L172,400" stroke="#ffb703" stroke-width="1.2" stroke-dasharray="6 5" opacity=".8"/>
  <text x="180" y="80" font-size="10" fill="#ffb703" font-weight="bold">불빛 ↔ 어둠 경계</text>
  <text x="180" y="92" font-size="9" fill="#ffe3a0">진짜 포인트는 이 라인</text>

  <!-- 좌: 워킹 에깅 -->
  <text x="12" y="112" font-size="11" fill="#8ef0c0" font-weight="bold">A. 워킹 (방파제)</text>
  <path d="M8,132 L54,150" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M54,150 Q106,132 150,166" stroke="#8ef0c0" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/>
  <path d="M150,166 Q128,196 96,214" stroke="#cfe0ee" stroke-width="1.4" fill="none"/>
  <g transform="translate(96,216) rotate(20)">
    <path d="M0,0 l26,-5 l5,5 l-5,5 z" fill="#ff5d8f" stroke="#fff" stroke-width="1"/>
    <g stroke="#f4f7fa" stroke-width="1.3" stroke-linecap="round"><path d="M-1,0 l-7,-5"/><path d="M-1,0 l-8,0"/><path d="M-1,0 l-7,5"/></g>
  </g>
  <text x="12" y="242" font-size="9.5" fill="#cfe0ee">소형 에기 1.8~2.5호</text>
  <text x="12" y="254" font-size="9" fill="#9fc3dd">어둠 → 불빛 쪽으로</text>
  <text x="12" y="265" font-size="9" fill="#9fc3dd">천천히 끌어오기</text>

  <!-- 우: 선상 이카메탈 -->
  <text x="188" y="126" font-size="11" fill="#ffb703" font-weight="bold">B. 선상 이카메탈</text>
  <path d="M256,140 L256,196" stroke="#dfe8ef" stroke-width="1.5"/>
  <!-- 가지 스테 -->
  <path d="M256,168 L236,178" stroke="#dfe8ef" stroke-width="1.2"/>
  <g transform="translate(228,180) rotate(20)">
    <path d="M0,0 l18,-4 l4,4 l-4,4 z" fill="#8ef0c0" stroke="#fff" stroke-width=".9"/>
    <g stroke="#f4f7fa" stroke-width="1.1" stroke-linecap="round"><path d="M0,0 l-6,-4"/><path d="M0,0 l-6,4"/></g>
  </g>
  <text x="186" y="196" font-size="9" fill="#8ef0c0">가지 스테</text>
  <!-- 메탈스틱 -->
  <g transform="translate(256,200)">
    <path d="M-5,0 l10,0 l-2,34 l-6,0 z" fill="#c9d6e2" stroke="#fff" stroke-width="1"/>
    <g stroke="#f4f7fa" stroke-width="1.4" stroke-linecap="round"><path d="M0,36 l-6,8"/><path d="M0,36 l6,8"/></g>
  </g>
  <text x="272" y="228" font-size="9.5" fill="#cfe0ee">메탈스틱</text>
  <text x="272" y="240" font-size="9" fill="#9fc3dd">수직 저킹</text>

  <!-- 오모리그 -->
  <text x="188" y="278" font-size="10.5" fill="#ffb703" font-weight="bold">오모리그</text>
  <path d="M196,290 L286,290" stroke="#dfe8ef" stroke-width="1.3"/>
  <ellipse cx="196" cy="290" rx="8" ry="6" fill="#5b6b7a" stroke="#cfd8e0"/>
  <g transform="translate(266,290)">
    <path d="M0,0 l18,-4 l4,4 l-4,4 z" fill="#8ef0c0" stroke="#fff" stroke-width=".9"/>
  </g>
  <text x="188" y="308" font-size="9" fill="#cfe0ee">봉돌 + 스테 1개 · 수평 운용</text>

  <!-- 한치 -->
  <g opacity=".85" transform="translate(120,330)">
    <path d="M0,0 q-6,-34 8,-52 q12,-16 24,0 q14,18 8,52 q-20,10 -40,0 z" fill="#e8b4c8" stroke="#fff0f5" stroke-width="1.2"/>
    <path d="M8,-52 l12,-16 l12,16 z" fill="#dba0b8" opacity=".9"/>
    <g stroke="#fff0f5" stroke-width="1.5" stroke-linecap="round">
      <path d="M4,4 q-4,18 -10,26"/><path d="M13,5 q-2,20 -5,28"/><path d="M22,5 q2,20 4,28"/><path d="M31,4 q5,18 10,26"/>
      <path d="M17,6 q0,26 -1,36"/><path d="M20,6 q2,26 4,36"/>
    </g>
    <circle cx="9" cy="-10" r="3.2" fill="#3a1a2a"/><circle cx="31" cy="-10" r="3.2" fill="#3a1a2a"/>
  </g>
  <text x="12" y="352" font-size="10.5" fill="#e8b4c8" font-weight="bold">한치 (창꼴뚜기)</text>
  <text x="12" y="365" font-size="9" fill="#cfe0ee">시즌 6~8월 · 8월은 후반</text>
  <text x="12" y="377" font-size="9" fill="#cfe0ee">씨알 굵고 마릿수 감소</text>
  <text x="12" y="400" font-size="9.5" fill="#ffb703">만조 근처 + 약간의 파도 = 최고 조합</text>
  <text x="12" y="416" font-size="9" fill="#9fc3dd">확실한 조과는 한치배 (승선 6~8만원, 장비 렌탈 가능)</text>
</svg>
