<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" width="320" height="430" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="sea5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aa0c4"/><stop offset="60%" stop-color="#1c5183"/><stop offset="100%" stop-color="#08243d"/>
    </linearGradient>
  </defs>
  <rect width="320" height="62" fill="#dbeaf5"/>
  <rect y="62" width="320" height="368" fill="url(#sea5)"/>
  <path d="M0,62 q20,-7 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" stroke="#fff" stroke-opacity=".6" stroke-width="2" fill="none"/>
  <!-- 모래 바닥 -->
  <path d="M0,352 q60,-10 120,-2 q70,10 120,-6 q40,-9 80,2 L320,430 L0,430 Z" fill="#c2a878"/>
  <path d="M0,352 q60,-10 120,-2 q70,10 120,-6 q40,-9 80,2" stroke="#a89060" stroke-width="1.4" fill="none"/>
  <text x="196" y="382" font-size="9.5" fill="#6b5a38">모래 바닥 — 밑걸림 적음</text>
  <g fill="#7a6a48" opacity=".5">
    <ellipse cx="60" cy="376" rx="10" ry="4"/><ellipse cx="150" cy="392" rx="8" ry="3"/>
  </g>

  <!-- A. 원투 -->
  <text x="10" y="26" font-size="11" fill="#0b2545" font-weight="bold">A. 원투 — 보리멸(모살치)</text>
  <path d="M6,44 L64,58" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M64,58 Q150,26 250,110" stroke="#3a556b" stroke-width="1.3" fill="none" stroke-dasharray="5 4"/>
  <text x="128" y="44" font-size="9" fill="#3a556b">원투 20~50m</text>

  <path d="M250,110 L250,330" stroke="#eef3f7" stroke-width="1.5"/>
  <!-- 다단 채비: 가지바늘 2~3본 -->
  <g stroke="#eef3f7" stroke-width="1.1">
    <path d="M250,190 L224,204"/><path d="M250,240 L224,254"/><path d="M250,290 L224,304"/>
  </g>
  <g stroke="#f4f7fa" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M224,204 q-2,10 -9,10 q-8,0 -8,-7"/>
    <path d="M224,254 q-2,10 -9,10 q-8,0 -8,-7"/>
    <path d="M224,304 q-2,10 -9,10 q-8,0 -8,-7"/>
  </g>
  <g fill="#d98a6a">
    <path d="M212,206 q10,4 6,12" stroke="#b06a4a" stroke-width="1.6" fill="none"/>
    <path d="M212,256 q10,4 6,12" stroke="#b06a4a" stroke-width="1.6" fill="none"/>
    <path d="M212,306 q10,4 6,12" stroke="#b06a4a" stroke-width="1.6" fill="none"/>
  </g>
  <text x="140" y="216" font-size="9.5" fill="#fff" font-weight="bold">다단채비</text>
  <text x="140" y="228" font-size="9" fill="#cfe0ee">2~3본 가지바늘</text>
  <text x="140" y="264" font-size="9" fill="#ffd9a0">미끼: 청갯지렁이</text>
  <text x="140" y="300" font-size="9" fill="#ffb703">목줄은 원줄보다</text>
  <text x="140" y="311" font-size="9" fill="#ffb703">한 치수 약하게</text>

  <ellipse cx="250" cy="338" rx="11" ry="9" fill="#5b6b7a" stroke="#cfd8e0"/>
  <text x="266" y="342" font-size="9.5" fill="#fff">봉돌 15~20호</text>

  <!-- 보리멸 -->
  <g opacity=".8" transform="translate(96,334)">
    <path d="M0,0 q14,-11 34,-9 q20,2 28,9 q-8,8 -28,10 q-20,2 -34,-10 z" fill="#e0d6be" stroke="#fff" stroke-width="1"/>
    <path d="M0,0 l-12,-8 l3,8 l-3,8 z" fill="#e0d6be" stroke="#fff" stroke-width=".9"/>
    <circle cx="56" cy="-2" r="2.2" fill="#3a3020"/>
  </g>

  <!-- B. 카드채비 -->
  <text x="10" y="120" font-size="11" fill="#fff" font-weight="bold">B. 카드채비(사비키) — 미끼 조달</text>
  <path d="M26,134 L26,150" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M26,150 L26,300" stroke="#eef3f7" stroke-width="1.5"/>
  <g stroke="#eef3f7" stroke-width="1">
    <path d="M26,172 L44,180"/><path d="M26,196 L44,204"/><path d="M26,220 L44,228"/>
    <path d="M26,244 L44,252"/><path d="M26,268 L44,276"/>
  </g>
  <g stroke="#f4f7fa" stroke-width="1.7" fill="none" stroke-linecap="round">
    <path d="M44,180 q2,8 -4,9"/><path d="M44,204 q2,8 -4,9"/><path d="M44,228 q2,8 -4,9"/>
    <path d="M44,252 q2,8 -4,9"/><path d="M44,276 q2,8 -4,9"/>
  </g>
  <g fill="#ff8fa3" opacity=".9">
    <circle cx="46" cy="182" r="2.6"/><circle cx="46" cy="206" r="2.6"/><circle cx="46" cy="230" r="2.6"/>
    <circle cx="46" cy="254" r="2.6"/><circle cx="46" cy="278" r="2.6"/>
  </g>
  <ellipse cx="26" cy="308" rx="8" ry="7" fill="#5b6b7a" stroke="#cfd8e0"/>
  <text x="58" y="182" font-size="9.5" fill="#fff">바늘 5~6개</text>
  <text x="58" y="196" font-size="9" fill="#cfe0ee">방파제 내항 직벽에서</text>
  <text x="58" y="207" font-size="9" fill="#cfe0ee">수직으로 올렸다 내렸다</text>
  <text x="58" y="228" font-size="9" fill="#ffd9a0">잔 씨알은 표층</text>
  <text x="58" y="239" font-size="9" fill="#ffd9a0">굵은 씨알은 바닥층</text>

  <!-- 전갱이 떼 -->
  <g opacity=".7" fill="#9fc3dd">
    <g transform="translate(84,300)"><path d="M0,0 q8,-6 20,-5 q12,1 16,5 q-4,5 -16,6 q-12,1 -20,-6 z"/><path d="M0,0 l-7,-5 l2,5 l-2,5 z"/></g>
    <g transform="translate(76,322)"><path d="M0,0 q8,-6 20,-5 q12,1 16,5 q-4,5 -16,6 q-12,1 -20,-6 z"/><path d="M0,0 l-7,-5 l2,5 l-2,5 z"/></g>
  </g>
  <text x="60" y="346" font-size="9" fill="#cfe0ee">전갱이 → 생미끼로 재사용</text>
  <text x="10" y="414" font-size="9.5" fill="#0b2545" font-weight="bold">밑걸림 시: 대를 위아래로 흔들거나 조류 반대편으로 이동해 채면 잘 빠진다</text>
</svg>
